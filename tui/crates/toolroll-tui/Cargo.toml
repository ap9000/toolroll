[package]
name = "toolroll-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "toolroll_tui"
path = "src/lib.rs"

[[bin]]
name = "toolroll-tui"
path = "src/main.rs"

[dependencies]
toolroll-api = { path = "../toolroll-api" }
ratatui.workspace = true
crossterm.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde_json.workspace = true
unicode-width = "0.2"

[dev-dependencies]
insta = "1"
serde = { version = "1" }
toolroll-fake-engine = { path = "../toolroll-fake-engine" }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "io-util", "rt-multi-thread"] }
