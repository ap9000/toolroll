[package]
name = "toolroll-fake-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# A stand-in console for tests and the PTY harness: the engine API's fixtures over real HTTP. Never shipped.
[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "form", "ws"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net"] }
serde_json.workspace = true
futures-util.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
