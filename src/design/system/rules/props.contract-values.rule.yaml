schema: youi.rule/v1
id: youi:toolroll/rule/props.contract-values
title: Props use the contract's values
severity: error
statement: A literal value for an enumerated prop must be one of the values in the component's contract.
rationale: An unknown variant renders a class the kit sheet does not style, so a typo or a value from another system ships as an unstyled control.
agent: Call system_get_component before using a component's props; use only the listed values.
check:
  engine: youi
  id: prop-values
  options: {}
files:
  - "**/*.tsx"
examples:
  bad:
    - <KButton variant="default" label="Save" />
  good:
    - <KButton variant="primary" label="Save" />
