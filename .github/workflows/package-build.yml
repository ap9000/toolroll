name: Package build

# The toolroll package a release publishes, built and checked WITHOUT any publishing right. ONE definition, called by
# publish.yml (whose separate, privileged job then publishes exactly this tarball) and by tui-bundle.yml (the same jobs
# on a pull request, so a release is never their first run):
#
#   - binary · <platform>: the terminal workbench's binary for each platform the package carries
#     (scripts/tui-build.mjs --bundle), built, ad-hoc signed (macOS, checked with codesign -v) and self-checked ON its
#     own platform, with a report of its sha256 and self-check line, uploaded as the artifact workbench-<platform>;
#   - assemble: each downloaded binary matched to its report's sha256 BEFORE anything runs (--adopt), the package built
#     (npm run prepublishOnly), every binary checked (--verify: architecture, mode, signature or static, the self-check
#     naming this build's contract digest, `npm pack --dry-run` listing exactly the four), then `npm pack`: the tarball
#     is uploaded as the artifact `package` and its sha256 is this workflow's output.
#
# Called only, never triggered on its own. Read-only token, no secret, no OIDC token: nothing here can publish. Its checks
# report as "<calling job's name> / binary · <platform>" and "<calling job's name> / assemble"; the matrix fills the
# platform in because the binary job has no `if:` and no `needs:` (GitHub reports a SKIPPED matrix job once, under its
# name as written), and src/ci-workflow.test.ts holds it that way. Actions are pinned to full commit SHAs and Rust to
# tui/rust-toolchain.toml.

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build (the caller's tested or tagged commit).
        type: string
        required: true
    outputs:
      tarball:
        description: The packed tarball's file name.
        value: ${{ jobs.assemble.outputs.tarball }}
      sha256:
        description: The packed tarball's sha256.
        value: ${{ jobs.assemble.outputs.sha256 }}

permissions:
  contents: read

jobs:
  binary:
    name: binary · ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - name: Toolchain (tui/rust-toolchain.toml's exact Rust)
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' tui/rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --target "$TARGET"
          cd tui && cargo --version && rustc --version
      - name: Build, sign and self-check on its own platform
        run: node scripts/tui-build.mjs --bundle "$RUNNER_TEMP/workbench/bin" --reports "$RUNNER_TEMP/workbench/reports" --targets "$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workbench-${{ matrix.platform }}
          path: ${{ runner.temp }}/workbench
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: assemble
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          check-latest: true
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: workbench-*
          path: ${{ runner.temp }}/workbench
          merge-multiple: true
      - name: The four binaries, each the exact file its build reported, into the package (nothing runs yet)
        run: node scripts/tui-build.mjs --adopt "$RUNNER_TEMP/workbench/bin" --reports "$RUNNER_TEMP/workbench/reports"
      - run: npm run prepublishOnly
      - name: Refuse unless every bundled binary checks out
        run: node scripts/tui-build.mjs --verify --reports "$RUNNER_TEMP/workbench/reports"
      - name: Pack the package, and say its sha256
        id: pack
        run: |
          out="$RUNNER_TEMP/package"
          mkdir -p "$out"
          npm pack --ignore-scripts --pack-destination "$out"
          count="$(find "$out" -maxdepth 1 -name '*.tgz' | wc -l)"
          test "$count" -eq 1 || { echo "::error::expected one tarball, found $count"; exit 1; }
          tarball="$(basename "$(find "$out" -maxdepth 1 -name '*.tgz')")"
          sha256="$(sha256sum "$out/$tarball" | cut -d ' ' -f 1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "packed $tarball, sha256 $sha256" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: ${{ runner.temp }}/package
          if-no-files-found: error
          retention-days: 7
