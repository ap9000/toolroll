  # Object containment need root, so a candidate's code has root there. They run in native-lanes.yml, a workflow run of
  # their own: one that shares no token and no artifact store with the jobs above. These three jobs keep the required
  # names in this file, because `toolroll release` (the deployed one, which judges each release), main's protection and
  # the release proof bind each name to ci.yml; each runs nothing of the candidate's and passes only when its lane's job
  # passed there (scripts/ci-native-wait.mjs). A call from main-push.yml or nightly.yml has those start the lanes first.
