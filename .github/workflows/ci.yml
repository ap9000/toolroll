          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && 'main') || github.sha }}
          path: .trusted-base
          persist-credentials: false
      - run: .trusted-base/scripts/ci-git.sh 2.47
      - name: The tests' git is git 2.47
        run: runuser -u node -- git --version | tee /dev/stderr | grep -qF "git version 2.47."
      # H1: the image's unprivileged user gets a copy of the checkout it owns (docs/plans/trusted-release-reports.md).
      # That copy is the one ownership exception; the workspace itself, and the base revision's scripts, stay root's.
      - name: The candidate's copy of the checkout
        run: |
          harness=.trusted-base/scripts
          if [ ! -f "$harness/ci-candidate.mjs" ]; then echo "::warning::the base revision has no candidate harness yet; using this change's own (a person approves it)"; harness=scripts; fi
          mkdir -p "$RUNNER_TEMP/harness"
          cp "$harness/ci-candidate.mjs" "$harness/ci-candidate-probe.cjs" "$harness/ci-no-skips.mjs" "$RUNNER_TEMP/harness/"
          node "$RUNNER_TEMP/harness/ci-candidate.mjs" prepare --workspace "$GITHUB_WORKSPACE" --temp "$RUNNER_TEMP" --user node
      - run: '"$RUNNER_TEMP/candidate" run -- npm ci --ignore-scripts'
      - run: '"$RUNNER_TEMP/candidate" canary'
      - run: '"$RUNNER_TEMP/candidate" run --env CI=true --report "$RUNNER_TEMP/git-lane.json" -- npm run test:git --'
