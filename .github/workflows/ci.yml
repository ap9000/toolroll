name: CI

# Every pull request (docs/plans/test-matrix.md): the full unit suite on Ubuntu and on macOS with Node 24, in four
# shards each joined by one required job per OS, plus the area lanes: Linux cgroup containment, the Linux fence,
# Windows Job Object containment and the git lanes. Node 22 (the engines floor) runs before each release instead, in
# release-candidate.yml; nightly.yml runs everything on main every night; main-push.yml runs this whole workflow on a
# push to main whose merge commit it can't prove tested (it calls it, so its runs never stand in for these).
#
# Every job tests the candidate itself: the pull request's head commit (the pushed commit when called), never the merge
# commit GitHub would synthesize, because that head is what `toolroll release` and auto-approve trust. A step proves
# the checkout is that commit and prints it. That the head also contains main's head (so the tested tree is the tree
# that merges) is the release gate's check, not CI's (docs/plans/eval-harness.md, phase 1 D).
#
# Conditions: GitHub reports a job skipped by `if:` as passing a required check in main's protection, and
# `toolroll release` never accepts a skipped check (src/release.ts prChecksVerdict). So only two kinds of job carry an
# `if:`: the shards' joins, which always run (a failed shard fails them), and the area lanes, which are skipped only
# when the trusted base revision's scripts/ci-scope.mjs found a documentation-only pull request (and run whenever that
# decision failed or is anything else). A release's pull request (a release-* branch) is never documentation-only, so
# its lanes always run. `toolroll release` waits for the job names by exact name (src/release.ts REQUIRED_PR_CHECKS),
# and src/ci-workflow.test.ts holds this file to that list.

on:
  pull_request:
  # main-push.yml (a merge commit not proven tested) and nightly.yml run this workflow whole.
  workflow_call:

permissions:
  contents: read

jobs:
  # The unit suite (`npm run test:all`) in shards: four on Node 24, run side by side (docs/plans/pipeline-speed.md: one
  # job ran it in 14–21 minutes; a shard runs a quarter). Each shard records the files it ran on the tested commit.
  test-shard:
    name: node ${{ matrix.node }} · shard ${{ matrix.shard }}/4
    # Pinned: ubuntu-latest moved to 26.04 (2026-10-21), where bubblewrap runs
    # unprivileged, so the agent-fence and ACP tests take the Linux fence road
    # they were never written for.
    runs-on: ubuntu-24.04
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
          # Migration tests build old releases from git history (git archive <old commit>).
          fetch-depth: 0
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The sandbox runtime's tools, and unprivileged user namespaces (ubuntu-24.04's AppArmor default refuses them),
      # as the linux fence job sets them up: flows' scripts and tools' servers run in the real Linux fence here.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Vitest's own JSON report, written outside the checkout and uploaded as it is: no candidate script summarizes it.
      # TOOLROLL_REQUIRE_NATIVE: a Linux fence attack that can't run here fails instead of skipping (a skip is not
      # evidence); the join's verifier runs with the same --native policy.
      - run: npm run test:all -- --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/shard-report.json"
        env:
          CI: "true"
          TOOLROLL_REQUIRE_NATIVE: linux
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.node }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The required Linux check, under the name `toolroll release` and main's protection wait for. It
  # always runs (a job skipped because a shard failed would read as passing to a required check) and fails unless
  # every shard passed and, together, the shards ran every test file the include policy finds in the tested commit,
  # each once, with consistent counts, tests executed and only the skips the base allows. It runs none of the
  # candidate's code: no install, and the verifier (with its inventory and skip policy) is the trusted base revision's
  # copy — the pull request's base, or main itself when called (Codex review round 1, finding 1). Until the base has a
  # verifier (the change that introduces it) the candidate's own is used and said; that change touches scripts/, which
  # an automatic release never approves.
  test:
    name: node ${{ matrix.node }} · ubuntu-latest
    needs: test-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Every shard passed
        shell: bash
        env:
          SHARDS: ${{ needs.test-shard.result }}
        run: test "$SHARDS" = success || { echo "the unit suite's shards ended $SHARDS" >&2; exit 1; }
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && 'main') || github.sha }}
          path: .trusted-base
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ matrix.node }}-*
          path: ${{ runner.temp }}/shards
      - name: Every shard ran the whole suite
        shell: bash
        run: |
          verifier=.trusted-base/scripts/ci-shards.mjs
          if [ ! -f "$verifier" ]; then echo "::warning::the base revision has no shard verifier yet; using this change's own (a person approves it)"; verifier=scripts/ci-shards.mjs; fi
          node "$verifier" verify "$RUNNER_TEMP/shards" --root "$GITHUB_WORKSPACE" --base "$GITHUB_WORKSPACE/.trusted-base" --sha "$TESTED_SHA" --node ${{ matrix.node }} --shards 4 --native linux

  # The unit suite on macOS (docs/plans/pipeline-speed.md, item 3a): it runs on the candidate itself, before anything
  # merges, sharded like the Linux suite, beside it; the release tag no longer runs it again (test-matrix.md). Each shard records the files it ran on the tested commit.
  macos-shard:
    name: node ${{ matrix.node }} · macos shard ${{ matrix.shard }}/4
    runs-on: macos-latest
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
          # Migration tests build old releases from git history (git archive <old commit>).
          fetch-depth: 0
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Vitest's own JSON report, written outside the checkout and uploaded as it is: no candidate script summarizes it.
      # TOOLROLL_REQUIRE_NATIVE: a Seatbelt attack that can't run on the hosted Mac fails instead of skipping; the join's
      # verifier runs with the same --native policy.
      - run: npm run test:all -- --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/shard-report.json"
        env:
          CI: "true"
          TOOLROLL_REQUIRE_NATIVE: darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-shard-${{ matrix.node }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The required macOS check, joined exactly as the Linux one: it always runs, and fails unless every
  # macOS shard passed and together they ran every test file of the tested commit once, judged by the trusted base
  # revision's verifier. `toolroll release` waits for it (REQUIRED_PR_CHECKS) and refuses to merge while main's
  # protection doesn't require it.
  macos:
    name: node ${{ matrix.node }} · macos-latest
    needs: macos-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Every shard passed
        shell: bash
        env:
          SHARDS: ${{ needs.macos-shard.result }}
        run: test "$SHARDS" = success || { echo "the macOS unit suite's shards ended $SHARDS" >&2; exit 1; }
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && 'main') || github.sha }}
          path: .trusted-base
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-shard-${{ matrix.node }}-*
          path: ${{ runner.temp }}/macos-downloads
      # The verifier reads shard-<node>-<i> folders; macOS artifacts carry a prefix so their names differ from Linux's.
      - name: The macOS shards' reports, under the verifier's names
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/shards"
          for folder in "$RUNNER_TEMP"/macos-downloads/*; do
            name="$(basename "$folder")"
            case "$name" in macos-shard-*) mv "$folder" "$RUNNER_TEMP/shards/${name#macos-}" ;; *) echo "unexpected $name among the macOS shards' reports" >&2; exit 1 ;; esac
          done
          # The shards ran on macOS runners, whose checkout is /Users/runner/work/<repo>/<repo>; this join runs on Linux.
          # Their reports name files under the macOS checkout: map exactly that prefix onto this checkout, so the
          # (trusted) verifier judges the same relative paths. Nothing else in the reports changes.
          mac_root="/Users/runner/work/${GITHUB_REPOSITORY#*/}/${GITHUB_REPOSITORY#*/}/"
          find "$RUNNER_TEMP/shards" -type f -name '*.json' -print0 | xargs -0 sed -i "s#\"${mac_root}#\"${GITHUB_WORKSPACE}/#g"
      - name: Every shard ran the whole suite
        shell: bash
        run: |
          verifier=.trusted-base/scripts/ci-shards.mjs
          if [ ! -f "$verifier" ]; then echo "::warning::the base revision has no shard verifier yet; using this change's own (a person approves it)"; verifier=scripts/ci-shards.mjs; fi
          node "$verifier" verify "$RUNNER_TEMP/shards" --root "$GITHUB_WORKSPACE" --base "$GITHUB_WORKSPACE/.trusted-base" --sha "$TESTED_SHA" --node ${{ matrix.node }} --shards 4 --native darwin

  # Whether the area lanes below apply (docs/plans/test-matrix.md): every pull request runs them except a narrow
  # documentation-only change (scripts/ci-scope.mjs says exactly which), and every release-* branch and every run that
  # isn't a pull request runs them. The decision is the trusted base revision's classifier over the pull request's diff
  # from its merge base, never the candidate's test output. A base without the classifier runs every lane.
  scope:
    name: area lanes · scope
    runs-on: ubuntu-24.04
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      areas: ${{ steps.decide.outputs.areas }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
          # The diff from the merge base needs both histories.
          fetch-depth: 0
          persist-credentials: false
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && 'main') || github.sha }}
          path: .trusted-base
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Documentation-only or not
        id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          classifier=.trusted-base/scripts/ci-scope.mjs
          if [ ! -f "$classifier" ]; then
            echo "::notice::the base revision has no scope classifier; running every lane"
            echo "areas=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node "$classifier" decide --event "$EVENT" --head-ref "$HEAD_REF" --base "$BASE_SHA" --head "$TESTED_SHA" --root "$GITHUB_WORKSPACE" | tee -a "$GITHUB_OUTPUT"

  # The native containment backend, EXECUTED: a cgroup v2 leaf is delegated
  # to the runner user (chown, as the kernel's delegation model prescribes)
  # and the test process is moved into it, so the real-process tests —
  # setsid escape, natural root exit, exact-run stop, worker death, held
  # supervisor — run against the kernel, and SO_EXPECT_NATIVE_CONTAINMENT
  # turns "facility unavailable" into a failure instead of a skip.
  linux-native-containment:
    name: linux native containment · delegated cgroup v2
    needs: scope
    # Skipped only on a documentation-only pull request, by a scope job that succeeded; otherwise it runs.
    if: ${{ always() && !(needs.scope.result == 'success' && needs.scope.outputs.areas == 'docs-only') }}
    runs-on: ubuntu-latest
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Delegate a cgroup v2 leaf and run the native tests inside it
        run: |
          set -euo pipefail
          test -f /sys/fs/cgroup/cgroup.controllers
          sudo mkdir -p /sys/fs/cgroup/so-ci
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/so-ci
          echo $$ | sudo tee /sys/fs/cgroup/so-ci/cgroup.procs >/dev/null
          echo "test shell cgroup: $(cat /proc/self/cgroup)"
          npx vitest run src/containment-native.test.ts src/containment.test.ts src/container-state.test.ts src/boot-identity.test.ts
        env:
          CI: "true"
          SO_EXPECT_NATIVE_CONTAINMENT: "1"

  # The windows-baseline matrix (node 22/24 over the service, scheduler,
  # builder and recipe suites) is parked: shared Windows hosts kept timing
  # out untouched tests. Bring it back with per-suite timeouts once the
  # runners are quiet. The Job Object containment test below still runs.

  # The Linux agent fence, EXECUTED (docs/plans/sandbox-parity.md): Anthropic's sandbox-runtime over bubblewrap with
  # unprivileged user namespaces (which ubuntu-24.04's AppArmor default refuses, so the runner allows them), socat for
  # its network relays and ripgrep for its protected-name scan; its seccomp helper ships in the package.
  # TOOLROLL_REQUIRE_NATIVE turns a Linux attack that can't run here into a failure: a skip is not evidence.
  linux-fence:
    name: linux fence · sandbox-runtime
    needs: scope
    # Skipped only on a documentation-only pull request, by a scope job that succeeded; otherwise it runs.
    if: ${{ always() && !(needs.scope.result == 'success' && needs.scope.outputs.areas == 'docs-only') }}
    runs-on: ubuntu-24.04
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run build
      - run: npm run test:attacks
        env:
          CI: "true"
          TOOLROLL_REQUIRE_NATIVE: linux

  native-windows:
    name: Windows Job Object containment
    needs: scope
    # Skipped only on a documentation-only pull request, by a scope job that succeeded; otherwise it runs.
    if: ${{ always() && !(needs.scope.result == 'success' && needs.scope.outputs.areas == 'docs-only') }}
    runs-on: windows-latest
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run src/containment-windows.test.ts
        env:
          CI: "true"
          SO_EXPECT_NATIVE_CONTAINMENT: "1"

  # Git's own behaviour, on the declared floor and on the last release before 2.48 (README, Requirements): the git attack
  # tests and the worktree/teardown tests, nothing else. 2.47 is Debian trixie's git and still has the pre-2.48
  # `worktree add` behaviour teardown-git.ts relinkAdded works around; 2.41 is the floor (the global `git --attr-source`,
  # src/git-floor.ts), its oldest release exactly (2.41.0, which also ignores GIT_NO_LAZY_FETCH), built from kernel.org's
  # tarball by scripts/ci-git.sh. Below 2.45 git has no `--no-lazy-fetch`, so
  # the floor lane also proves a partial clone is refused for protected reads. The tests run as the image's unprivileged user (root passes
  # permission checks an operator's git can't), and a skipped test fails the job: a skip is not evidence. The only
  # skips allowed are the "native …" OS-fence attacks, which need bubblewrap/Seatbelt and run in the linux fence job.
  git:
    name: git ${{ matrix.git }} · debian trixie
    needs: scope
    # Skipped only on a documentation-only pull request, by a scope job that succeeded; otherwise it runs.
    if: ${{ always() && !(needs.scope.result == 'success' && needs.scope.outputs.areas == 'docs-only') }}
    runs-on: ubuntu-24.04
    # --init: an init process reaps orphaned children, as a real machine's PID 1 does (the pool's orphaned-group test).
    container:
      image: node:22-trixie
      options: --init
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        git: ["2.41", "2.47"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
      - run: chown -R node:node "$GITHUB_WORKSPACE"
      - name: Tested commit
        run: |
          head="$(runuser -u node -- git rev-parse HEAD)"
          test "$head" = "$TESTED_SHA" || { echo "checked out $head, expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: scripts/ci-git.sh ${{ matrix.git }}
      - name: The tests' git is git ${{ matrix.git }}
        run: runuser -u node -- git --version | tee /dev/stderr | grep -qF "git version ${{ matrix.git }}."
      - run: runuser -u node -- npm ci
      - run: runuser -u node -- npm run test:git -- --reporter=default --reporter=json --outputFile.json=git-lane.json
        env:
          CI: "true"
      - name: Every git test ran
        run: runuser -u node -- node scripts/ci-no-skips.mjs git-lane.json
      - name: Partial clones are refused on the floor's git
        if: matrix.git == '2.41'
        run: runuser -u node -- npx vitest run test/attacks/checkout-git-partial-clone.test.ts --reporter=default --reporter=json --outputFile.json=partial-clone.json && runuser -u node -- node scripts/ci-no-skips.mjs partial-clone.json
        env:
          CI: "true"
