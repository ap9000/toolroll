  # Git's own behaviour, on the declared floor and on the last release before 2.48 (README, Requirements): the git attack
  # tests and the worktree/teardown tests, nothing else. 2.47 is Debian trixie's git and still has the pre-2.48
  # `worktree add` behaviour teardown-git.ts relinkAdded works around; 2.41 is the floor (the global `git --attr-source`,
  # src/git-floor.ts), its oldest release exactly (2.41.0, which also ignores GIT_NO_LAZY_FETCH), built from kernel.org's
  # tarball by the base revision's scripts/ci-git.sh. Below 2.45 git has no `--no-lazy-fetch`, so
  # the floor lane also proves a partial clone is refused for protected reads. The tests run as the image's unprivileged user (root passes
  # permission checks an operator's git can't), and a skipped test fails the job: a skip is not evidence. The only
  # skips allowed are the "native …" OS-fence attacks, which need bubblewrap/Seatbelt and run in the linux fence job.
  # Two jobs, no matrix: GitHub doesn't expand a matrix for a job its `if:` skips (a docs-only pull request reported
  # "git ${{ matrix.git }} · …") and appends the values of a matrix a name doesn't mention ("… (2.41)"); either way the
  # required checks never arrive.
  git-floor:
    name: git 2.41 · debian trixie
    needs: scope
    # Skipped only on a documentation-only pull request, by a scope job that succeeded; otherwise it runs.
    if: ${{ always() && !(needs.scope.result == 'success' && needs.scope.outputs.areas == 'docs-only') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # --init: an init process reaps orphaned children, as a real machine's PID 1 does (the pool's orphaned-group test).
    container:
      image: node:22-trixie
      options: --init
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Tested commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && 'main') || github.sha }}
          path: .trusted-base
          persist-credentials: false
      - run: .trusted-base/scripts/ci-git.sh 2.41
      - name: The tests' git is git 2.41
        run: runuser -u node -- git --version | tee /dev/stderr | grep -qF "git version 2.41."
      # H1: the image's unprivileged user gets a copy of the checkout it owns (docs/plans/trusted-release-reports.md).
      # That copy is the one ownership exception; the workspace itself, and the base revision's scripts, stay root's.
      - name: The candidate's copy of the checkout
        run: |
          harness=.trusted-base/scripts
          if [ ! -f "$harness/ci-candidate.mjs" ]; then echo "::warning::the base revision has no candidate harness yet; using this change's own (a person approves it)"; harness=scripts; fi
          mkdir -p "$RUNNER_TEMP/harness"
          cp "$harness/ci-candidate.mjs" "$harness/ci-candidate-probe.cjs" "$harness/ci-no-skips.mjs" "$RUNNER_TEMP/harness/"
          node "$RUNNER_TEMP/harness/ci-candidate.mjs" prepare --workspace "$GITHUB_WORKSPACE" --temp "$RUNNER_TEMP" --user node
      - run: '"$RUNNER_TEMP/candidate" run -- npm ci --ignore-scripts'
      - run: '"$RUNNER_TEMP/candidate" canary'
      - run: '"$RUNNER_TEMP/candidate" run --env CI=true --report "$RUNNER_TEMP/git-lane.json" -- npm run test:git --'
      - name: Every git test ran
        run: node "$RUNNER_TEMP/harness/ci-no-skips.mjs" "$RUNNER_TEMP/git-lane.json"
      - name: Partial clones are refused on the floor's git
        run: '"$RUNNER_TEMP/candidate" run --env CI=true --report "$RUNNER_TEMP/partial-clone.json" -- npx vitest run test/attacks/checkout-git-partial-clone.test.ts && node "$RUNNER_TEMP/harness/ci-no-skips.mjs" "$RUNNER_TEMP/partial-clone.json"'

  git-247:
    name: git 2.47 · debian trixie
    needs: scope
    # Skipped only on a documentation-only pull request, by a scope job that succeeded; otherwise it runs.
