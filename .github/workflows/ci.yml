name: CI

# Every pull request (docs/plans/test-matrix.md, docs/plans/ci-speed.md): the full unit suite on Ubuntu with Node 24 in
# six timing-balanced shards, and the macOS lane of it (every file that can behave differently on a Mac, plus a smoke
# set; scripts/ci-shards.mjs LANES) on macOS in three, each joined by one required job per OS, plus the area lanes: Linux cgroup containment, the Linux fence,
# Windows Job Object containment (each run by native-lanes.yml, and waited for here) and the git lanes. Node 22 (the engines floor) runs before each release instead, in
# release-candidate.yml; nightly.yml runs everything on main every night; main-push.yml runs this whole workflow on a
# push to main whose merge commit it can't prove tested (it calls it, so its runs never stand in for these).
#
# Every job tests the candidate itself: the pull request's head commit (the pushed commit when called), never the merge
# commit GitHub would synthesize, because that head is what `toolroll release` and auto-approve trust. A step proves
# the checkout is that commit and prints it. That the head also contains main's head (so the tested tree is the tree
# that merges) is the release gate's check, not CI's (docs/plans/eval-harness.md, phase 1 D).
#
# Conditions: GitHub reports a job skipped by `if:` as passing a required check in main's protection, and
# `toolroll release` never accepts a skipped check (src/release.ts prChecksVerdict). So only two kinds of job carry an
# `if:`: the shards' joins, which always run (a failed shard fails them), and the area lanes, which are skipped only
# when the trusted base revision's scripts/ci-scope.mjs found a documentation-only pull request (and run whenever that
# decision failed or is anything else). A release's pull request (a release-* branch) is never documentation-only, so
# its lanes always run. `toolroll release` waits for the job names by exact name (src/release.ts REQUIRED_PR_CHECKS),
# and src/ci-workflow.test.ts holds this file to that list.

on:
  pull_request:
  # main-push.yml (a merge commit not proven tested) and nightly.yml run this workflow whole.
  workflow_call:
    inputs:
      # Which files the macOS shards run: the macOS lane (`macos`, every pull request and main-push.yml) or the whole
      # suite (`all`, nightly.yml). Never part of a check's name.
      macos_lane:
        type: string
        default: macos

permissions:
  contents: read

# A newer push to a pull request cancels the run on its older head (docs/plans/ci-speed.md, item 5). Never a release-*
# branch's (each of its runs stands on its own head, and none waits behind another), never a call from main-push.yml or
# nightly.yml: those get a group of their own run id, so nothing ever cancels them.
concurrency:
  group: ci-${{ (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-')) && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  # The unit suite (`npm run test:all`) in shards: six on Node 24, run side by side (docs/plans/pipeline-speed.md: one
  # job ran it in 14–21 minutes). `--shard=i/K` takes the files test/timings.json's plan gives shard i, slowest first
  # (test/shard-sequencer.ts), so the shards end together. Each shard records the files it ran on the tested commit.
  test-shard:
    name: node ${{ matrix.node }} · shard ${{ matrix.shard }}/6
    # Pinned: ubuntu-latest moved to 26.04 (2026-10-21), where bubblewrap runs
    # unprivileged, so the agent-fence and ACP tests take the Linux fence road
    # they were never written for.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
          # Migration tests build old releases from git history (git archive <old commit>).
          fetch-depth: 0
          # The candidate's copy of this checkout must hold no token.
          persist-credentials: false
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      # The harness comes from the base revision: nothing the candidate wrote decides how it is run.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && 'main') || github.sha }}
          path: .trusted-base
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # The newest patch release: a cached older one hid SQLite 3.54.1 from the suite (0.9.105).
          check-latest: true
          cache: npm
      # The sandbox runtime's tools, and unprivileged user namespaces (ubuntu-24.04's AppArmor default refuses them),
      # as the linux fence job sets them up: flows' scripts and tools' servers run in the real Linux fence here.
      # Ubuntu's mirrors fail for minutes, once for hours (86% of failed CI jobs in Oct–Nov 2026 were this step). The
      # pinned packages first, then bounded retries inside the step's limit: the image's package lists, then up to three
      # refresh-and-install attempts, each under `timeout`. The tools are checked here, so a missing one fails setup, not a test. Kept inline (no
      # composite action): it runs as root, and a local action would come from the change's own checkout.
      - name: Linux tools, pinned packages first, then Ubuntu's mirrors with bounded retries
        timeout-minutes: 10
        run: |
          pkgs="bubblewrap socat ripgrep"
          have() { for b in bwrap socat rg; do command -v "$b" >/dev/null || return 1; done; }
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          # First the pinned packages from this repository's ci-tools release (GitHub's own hosts: they answer when
          # Ubuntu's mirrors don't), each file checked against its SHA-256 before anything installs it; Ubuntu's mirrors
          # only when they don't install (a newer image can outgrow them). The release notes say how the files were
          # fetched and checked; refresh them with a new release tag and new hashes here, never by replacing files.
          pinned="https://github.com/ap9000/toolroll/releases/download/ci-tools-noble-1"
          debs="$RUNNER_TEMP/ci-tools"; mkdir -p "$debs"
          if ! have; then
            if (cd "$debs" && timeout 60 curl -fsSL --retry 2 --retry-delay 3 --remote-name-all \
                  "$pinned/bubblewrap_0.9.0-1ubuntu0.3_amd64.deb" "$pinned/ripgrep_14.1.0-1_amd64.deb" "$pinned/socat_1.8.0.0-4ubuntu0.1_amd64.deb" &&
                printf '%s  %s\n' \
                  2461f1beee9cb04c8942739fe1a2b37e7b7c2a3d518f0779dc75f9245baa3094 bubblewrap_0.9.0-1ubuntu0.3_amd64.deb \
                  c5ae63c7bee915b1cfc9f0bd07c55b4ce7f2bcd1133cba4da56719aac26101a4 ripgrep_14.1.0-1_amd64.deb \
                  46e854289b6b1c97e28be5d9293bea61e8633d00d6a65d9513f019c7232696fe socat_1.8.0.0-4ubuntu0.1_amd64.deb |
                  sha256sum --strict -c -) && sudo dpkg -i "$debs"/*.deb; then
              :
            else
              echo "::warning::Linux tools: the pinned packages did not install, using Ubuntu's mirrors"
              sudo dpkg -r bubblewrap socat ripgrep >/dev/null 2>&1 || true
            fi
          fi
          have || timeout 60 $apt install -y --no-install-recommends $pkgs || true
          for attempt in 1 2 3; do
            have && break
            sudo dpkg --configure -a || true
            timeout 60 $apt update || echo "::warning::Linux tools: refreshing the package lists failed, trying the install anyway"
            timeout 60 $apt install -y --no-install-recommends $pkgs && break
            echo "::warning::Linux tools: attempt $attempt failed, retrying"; sleep 10
          done
          have || { echo "::error::Linux tools could not be installed: Ubuntu's package servers did not answer"; exit 1; }
          bwrap --version && socat -V | head -2 | tail -1 && rg --version | head -1
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # docs/plans/trusted-release-reports.md, H1: every phase that loads the candidate's code (install, typecheck, the
      # build's Tailwind plugins, the tests) runs as a user of its own, with no sudo, in a copy of the checkout.
      - name: The candidate's user and its copy of the checkout
        shell: bash
        run: |
          harness=.trusted-base/scripts
          if [ ! -f "$harness/ci-candidate.mjs" ]; then echo "::warning::the base revision has no candidate harness yet; using this change's own (a person approves it)"; harness=scripts; fi
          mkdir -p "$RUNNER_TEMP/harness"
          cp "$harness/ci-candidate.mjs" "$harness/ci-candidate-probe.cjs" "$RUNNER_TEMP/harness/"
          sudo -n "$(command -v node)" "$RUNNER_TEMP/harness/ci-candidate.mjs" prepare --workspace "$GITHUB_WORKSPACE" --temp "$RUNNER_TEMP" --npm-cache "$(npm config get cache)" --tool-cache "$RUNNER_TOOL_CACHE"
      - run: '"$RUNNER_TEMP/candidate" run -- npm ci --ignore-scripts'
      # Inside this job, not beside it: what it proves is this job's own isolation.
      - run: '"$RUNNER_TEMP/candidate" canary'
      - run: '"$RUNNER_TEMP/candidate" run -- npm run typecheck'
      - run: '"$RUNNER_TEMP/candidate" run -- npm run build'
      # Vitest's own JSON report, back on fd 3 and converted on the trusted side: no candidate script summarizes it.
      # TOOLROLL_REQUIRE_NATIVE: a native attack that can't run here fails instead of skipping (a skip is not evidence);
      # the join's verifier runs with the same --native policy.
      - run: '"$RUNNER_TEMP/candidate" run --env CI=true --env TOOLROLL_REQUIRE_NATIVE=linux --report "$RUNNER_TEMP/shard-report.json" -- npm run test:all -- --shard=${{ matrix.shard }}/6'
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.node }}-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard-report.json
          if-no-files-found: error
          retention-days: 7

  # The required Linux check, under the name `toolroll release` and main's protection wait for. It
  # always runs (a job skipped because a shard failed would read as passing to a required check) and fails unless
  # every shard passed and, together, the shards ran every test file the include policy finds in the tested commit,
  # each once, with consistent counts, tests executed and only the skips the base allows. It runs none of the
  # candidate's code: no install, and the verifier (with its inventory and skip policy) is the trusted base revision's
  # copy — the pull request's base, or main itself when called (Codex review round 1, finding 1). Until the base has a
  # verifier (the change that introduces it) the candidate's own is used and said; that change touches scripts/, which
  # an automatic release never approves.
  test:
    name: node ${{ matrix.node }} · ubuntu-latest
    needs: test-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Every shard passed
        shell: bash
        env:
          SHARDS: ${{ needs.test-shard.result }}
        run: test "$SHARDS" = success || { echo "the unit suite's shards ended $SHARDS" >&2; exit 1; }
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && 'main') || github.sha }}
          path: .trusted-base
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ matrix.node }}-*
          path: ${{ runner.temp }}/downloads
      # Attempt-named artifacts (a rerun can't overwrite one): each shard's newest attempt, under the verifier's names.
      - name: The shards' newest reports
        shell: bash
        run: |
          harness=.trusted-base/scripts/ci-candidate.mjs
          if [ ! -f "$harness" ]; then echo "::warning::the base revision has no candidate harness yet; using this change's own (a person approves it)"; harness=scripts/ci-candidate.mjs; fi
          node "$harness" join --from "$RUNNER_TEMP/downloads" --to "$RUNNER_TEMP/shards"
      - name: Every shard ran the whole suite
        shell: bash
        run: |
          verifier=.trusted-base/scripts/ci-shards.mjs
          if [ ! -f "$verifier" ]; then echo "::warning::the base revision has no shard verifier yet; using this change's own (a person approves it)"; verifier=scripts/ci-shards.mjs; fi
          node "$verifier" verify "$RUNNER_TEMP/shards" --root "$GITHUB_WORKSPACE" --base "$GITHUB_WORKSPACE/.trusted-base" --sha "$TESTED_SHA" --node ${{ matrix.node }} --shards 6 --native linux

  # The unit suite on macOS (docs/plans/pipeline-speed.md, item 3a): it runs on the candidate itself, before anything
  # merges, sharded like the Linux suite, beside it; the release tag no longer runs it again (test-matrix.md). On a pull
  # request it runs the macOS lane (docs/plans/ci-speed.md, item 3: what can behave differently on a Mac, and a smoke
  # set; Linux runs every file), in three timing-balanced shards; the nightly runs every file here too. Each shard
  # records the files it ran on the tested commit.
  macos-shard:
    name: node ${{ matrix.node }} · macos shard ${{ matrix.shard }}/3
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
          # Migration tests build old releases from git history (git archive <old commit>).
          fetch-depth: 0
          # The candidate's copy of this checkout must hold no token.
          persist-credentials: false
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      # The harness comes from the base revision: nothing the candidate wrote decides how it is run.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && 'main') || github.sha }}
          path: .trusted-base
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # The newest patch release: a cached older one hid SQLite 3.54.1 from the suite (0.9.105).
          check-latest: true
          cache: npm
      # docs/plans/trusted-release-reports.md, H1: every phase that loads the candidate's code (install, typecheck, the
      # build's Tailwind plugins, the tests) runs as a user of its own, with no sudo, in a copy of the checkout.
      - name: The candidate's user and its copy of the checkout
        shell: bash
        run: |
          harness=.trusted-base/scripts
          if [ ! -f "$harness/ci-candidate.mjs" ]; then echo "::warning::the base revision has no candidate harness yet; using this change's own (a person approves it)"; harness=scripts; fi
          mkdir -p "$RUNNER_TEMP/harness"
          cp "$harness/ci-candidate.mjs" "$harness/ci-candidate-probe.cjs" "$RUNNER_TEMP/harness/"
          sudo -n "$(command -v node)" "$RUNNER_TEMP/harness/ci-candidate.mjs" prepare --workspace "$GITHUB_WORKSPACE" --temp "$RUNNER_TEMP" --npm-cache "$(npm config get cache)" --tool-cache "$RUNNER_TOOL_CACHE"
      - run: '"$RUNNER_TEMP/candidate" run -- npm ci --ignore-scripts'
      # Inside this job, not beside it: what it proves is this job's own isolation.
      - run: '"$RUNNER_TEMP/candidate" canary'
      - run: '"$RUNNER_TEMP/candidate" run -- npm run typecheck'
      - run: '"$RUNNER_TEMP/candidate" run -- npm run build'
      # Vitest's own JSON report, back on fd 3 and converted on the trusted side: no candidate script summarizes it.
      # TOOLROLL_REQUIRE_NATIVE: a native attack that can't run here fails instead of skipping (a skip is not evidence);
      # the join's verifier runs with the same --native policy.
      - run: '"$RUNNER_TEMP/candidate" run --env CI=true --env TOOLROLL_REQUIRE_NATIVE=darwin --env TOOLROLL_TEST_LANE="$LANE" --report "$RUNNER_TEMP/shard-report.json" -- npm run test:all -- --shard=${{ matrix.shard }}/3'
        env:
          LANE: ${{ inputs.macos_lane || 'macos' }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-shard-${{ matrix.node }}-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard-report.json
          if-no-files-found: error
          retention-days: 7

  # The required macOS check, joined exactly as the Linux one: it always runs, and fails unless every
  # macOS shard passed and together they ran every test file of the tested commit once, judged by the trusted base
  # revision's verifier. `toolroll release` waits for it (REQUIRED_PR_CHECKS) and refuses to merge while main's
  # protection doesn't require it.
  macos:
    name: node ${{ matrix.node }} · macos-latest
    # The Linux shards too: what they skipped must be among the files the macOS lane ran (ci-shards.mjs linuxSkipsProblem).
    needs: [macos-shard, test-shard]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Every shard passed
        shell: bash
        env:
          SHARDS: ${{ needs.macos-shard.result }}
        run: test "$SHARDS" = success || { echo "the macOS unit suite's shards ended $SHARDS" >&2; exit 1; }
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && 'main') || github.sha }}
          path: .trusted-base
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-shard-${{ matrix.node }}-*
          path: ${{ runner.temp }}/macos-downloads
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ matrix.node }}-*
          path: ${{ runner.temp }}/linux-downloads
      # The verifier reads shard-<node>-<i> folders; macOS artifacts carry a prefix so their names differ from Linux's, and
      # both carry their attempt, so a rerun never overwrites one: each shard's newest attempt stands.
      - name: The macOS shards' reports, under the verifier's names
        shell: bash
        run: |
          harness=.trusted-base/scripts/ci-candidate.mjs
          if [ ! -f "$harness" ]; then echo "::warning::the base revision has no candidate harness yet; using this change's own (a person approves it)"; harness=scripts/ci-candidate.mjs; fi
          node "$harness" join --from "$RUNNER_TEMP/macos-downloads" --to "$RUNNER_TEMP/shards"
          node "$harness" join --from "$RUNNER_TEMP/linux-downloads" --to "$RUNNER_TEMP/linux-shards"
          # The shards ran on macOS runners, whose checkout is /Users/runner/work/<repo>/<repo>; this join runs on Linux.
          # Their reports name files under the macOS checkout: map exactly that prefix onto this checkout, so the
          # (trusted) verifier judges the same relative paths. Nothing else in the reports changes.
          mac_root="/Users/runner/work/${GITHUB_REPOSITORY#*/}/${GITHUB_REPOSITORY#*/}/"
          find "$RUNNER_TEMP/shards" -type f -name '*.json' -print0 | xargs -0 sed -i "s#\"${mac_root}#\"${GITHUB_WORKSPACE}/#g"
      # The lane's files are the trusted verifier's own policy over this checkout (LANES): a candidate can't shrink them.
      - name: Every shard ran the whole lane
        shell: bash
        env:
          LANE: ${{ inputs.macos_lane || 'macos' }}
        run: |
          verifier=.trusted-base/scripts/ci-shards.mjs
          if [ ! -f "$verifier" ]; then echo "::warning::the base revision has no shard verifier yet; using this change's own (a person approves it)"; verifier=scripts/ci-shards.mjs; fi
          if ! grep -q "export function linuxSkipsProblem" "$verifier"; then echo "::warning::the base revision's shard verifier has no macOS lane yet; using this change's own (a person approves it)"; verifier=scripts/ci-shards.mjs; fi
          node "$verifier" verify "$RUNNER_TEMP/shards" --root "$GITHUB_WORKSPACE" --base "$GITHUB_WORKSPACE/.trusted-base" --sha "$TESTED_SHA" --node ${{ matrix.node }} --shards 3 --native darwin --lane "$LANE" --linux-reports "$RUNNER_TEMP/linux-shards" --linux-shards 6

  # The newest Node (docs/plans/test-matrix.md): what a person installs today, whose bundled SQLite can refuse what the
  # suite's Node 24 takes (0.9.105: SQLite 3.54.1, bundled from Node 22.23, 24.22 and 26.13 on, refused the Tasks list).
  # The SQLite checks only: every Tasks list read and the store's own statements prepare and run. Not a required check,
  # but an ordinary one: a release waits for it and a failure fails the release.
  node-latest:
    name: node 26 · SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
          # The candidate's copy of this checkout must hold no token.
          persist-credentials: false
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      # The harness comes from the base revision: nothing the candidate wrote decides how it is run.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && 'main') || github.sha }}
          path: .trusted-base
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          check-latest: true
          cache: npm
      - name: The candidate's user and its copy of the checkout
        shell: bash
        run: |
          harness=.trusted-base/scripts
          if [ ! -f "$harness/ci-candidate.mjs" ]; then echo "::warning::the base revision has no candidate harness yet; using this change's own (a person approves it)"; harness=scripts; fi
          mkdir -p "$RUNNER_TEMP/harness"
          cp "$harness/ci-candidate.mjs" "$harness/ci-candidate-probe.cjs" "$RUNNER_TEMP/harness/"
          sudo -n "$(command -v node)" "$RUNNER_TEMP/harness/ci-candidate.mjs" prepare --workspace "$GITHUB_WORKSPACE" --temp "$RUNNER_TEMP" --npm-cache "$(npm config get cache)" --tool-cache "$RUNNER_TOOL_CACHE"
      - run: '"$RUNNER_TEMP/candidate" run -- npm ci --ignore-scripts'
      - run: '"$RUNNER_TEMP/candidate" canary'
      - run: '"$RUNNER_TEMP/candidate" run --env CI=true -- npx vitest run src/sqlite-compat.test.ts src/store.test.ts src/sqlite-telemetry.test.ts'

  # Whether the area lanes below apply (docs/plans/test-matrix.md): every pull request runs them except a narrow
  # documentation-only change (scripts/ci-scope.mjs says exactly which), and every release-* branch and every run that
  # isn't a pull request runs them. The decision is the trusted base revision's classifier over the pull request's diff
  # from its merge base, never the candidate's test output. A base without the classifier runs every lane.
  scope:
    name: area lanes · scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      areas: ${{ steps.decide.outputs.areas }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
          # The diff from the merge base needs both histories.
          fetch-depth: 0
          persist-credentials: false
      - name: Tested commit
        shell: bash
        run: |
