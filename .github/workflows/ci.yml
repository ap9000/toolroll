        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event_name == 'workflow_dispatch' && 'main') || github.sha }}
          path: .trusted-base
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
