name: Install smoke

# A newcomer's first minute, on the package a release would publish (scripts/install-smoke.mjs): build, `npm pack`,
# `npm i -g` the tarball into a scratch prefix with a throwaway HOME, then `toolroll --version` (package.json's),
# `toolroll help`, `toolroll demo --port <n> --json` (starts, answers, stops, removes its sandbox) and install.sh as
# `curl … | sh` runs it, installing the same tarball (SO_PACKAGE) with SO_NO_START=1. On Linux and macOS.
#
# And the first terminal start, the way people's Linux machines have it (scripts/container-smoke.sh, one container per
# lane): the packed tarball installed, then `toolroll` at a real pseudo-terminal, first and again, asserting the
# outcome and the state it leaves (local mode on, or nothing made): a desktop user with umask 0002 (refused with the
# exact repair; after it, a clean start), on x64 and arm64; Docker's default profile with no user namespaces; Alpine
# (musl, busybox ps); Fedora without procps-ng; Debian 12 (refused at the git floor) and Debian 13 (opens). None has
# xdg-open or a display.
#
# Which runs: pull requests that change what gets packed or installed (a release-* pull request always does: it changes
# package.json, and its head is the tree the tag publishes), and by hand (on a tag too: Run workflow, pick the tag). The
# release tag itself runs no tests (docs/TESTING.md). Advisory: it is not one of REQUIRED_PR_CHECKS, and the release
# verdict leaves these jobs out by name and workflow (release.ts ADVISORY_PR_CHECKS), so a release never waits for them
# or fails on them. No secrets: it reads only, and needs the public npm registry for the package's dependencies.

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "install.sh"
      - "tsconfig.build.json"
      - "scripts/install-smoke.mjs"
      - "scripts/postbuild.mjs"
      - "scripts/browser-build.mjs"
      - "src/bin.ts"
      - "src/cli.ts"
      - "src/cli-fast.ts"
      - "src/cli-help.ts"
      - "src/version.ts"
      - "src/demo*.ts"
      - "src/easy-start*.ts"
      - "src/quick-start.ts"
      - "src/preflight.ts"
      - "src/sandbox-runtime.ts"
      - "src/sandbox-tools.ts"
      - "src/trusted-path.ts"
      - "src/trust-repair.ts"
      - "src/status-probe.ts"
      - "src/process-identity.ts"
      - "src/runner-process.ts"
      - "src/browser-open.ts"
      - "src/git-floor.ts"
      - "src/doctor.ts"
      - "scripts/container-smoke.*"
      - ".github/workflows/install-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the run on its older head; never a release-* branch's run.
concurrency:
  group: install-smoke-${{ (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-')) && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: install smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      # The engines floor's major (package.json: node >=22.20), the Node most newcomers have.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          # The newest patch release: a cached older one hid SQLite 3.54.1 (Node 22.23, 24.22) from the suite.
          check-latest: true
          cache: npm
      - run: npm ci
      # Builds, packs, installs and runs the package in a throwaway home under the runner's temp folder.
      - name: Install smoke
        timeout-minutes: 10
        env:
          TMPDIR: ${{ runner.temp }}
        run: node scripts/install-smoke.mjs

  containers:
    name: install smoke · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "ubuntu umask 0002", lane: ubuntu-umask002, image: "ubuntu:24.04", runner: ubuntu-24.04, privileged: true }
          - { name: "ubuntu umask 0002 · arm64", lane: ubuntu-umask002, image: "ubuntu:24.04", runner: ubuntu-24.04-arm, privileged: true }
          - { name: "no user namespaces", lane: no-userns, image: "ubuntu:24.04", runner: ubuntu-24.04, privileged: false }
          - { name: "alpine", lane: alpine, image: "alpine:3.22", runner: ubuntu-24.04, privileged: true }
          - { name: "fedora", lane: fedora, image: "fedora:43", runner: ubuntu-24.04, privileged: true }
          - { name: "debian 12", lane: debian12, image: "node:22-bookworm", runner: ubuntu-24.04, privileged: true }
          - { name: "debian 13", lane: debian13, image: "node:22-trixie", runner: ubuntu-24.04, privileged: true }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Pack
        shell: bash
        run: |
          npm run build
          mkdir -p "$RUNNER_TEMP/smoke"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/smoke"
          cp scripts/container-smoke.sh scripts/container-smoke.mjs "$RUNNER_TEMP/smoke/"
      # Ubuntu 24.04 runners restrict unprivileged user namespaces with AppArmor, which a privileged container doesn't
      # lift for a non-root user: lifted on this throwaway runner so those lanes stand for a desktop where they work.
      - name: Allow user namespaces on the runner
        if: matrix.privileged
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: First terminal start, then again
        timeout-minutes: 15
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          IMAGE: ${{ matrix.image }}
          PRIVILEGED: ${{ matrix.privileged }}
        run: |
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          flags=()
          if [ "$PRIVILEGED" = "true" ]; then flags+=(--privileged); fi
          docker run --rm "${flags[@]}" -v "$RUNNER_TEMP/smoke:/work" -v "$node_root:/opt/node:ro" "$IMAGE" sh /work/container-smoke.sh "$LANE"
