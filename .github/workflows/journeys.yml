name: Journeys

# Every pull request (docs/plans/ci-speed.md, item 4): the scripted end-to-end journeys (scripts/app-e2e.mjs and
# scripts/flows-e2e.mjs with --journeys scripted: the real console, worker and browser, the model scripted, no model
# calls), their groups side by side, each in a world of its own (scripts/e2e-parallel.mjs). A journey a change left
# stale fails here, on the pull request, instead of in the release check. Advisory for now: it is not one of
# REQUIRED_PR_CHECKS, and the release verdict leaves these jobs out by name and workflow (release.ts
# ADVISORY_PR_CHECKS), so a release never waits for them or fails on them; the release check still runs every journey.

on:
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the run on its older head; never a release-* branch's run.
concurrency:
  group: journeys-${{ (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-')) && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  journeys:
    name: journeys · ${{ matrix.script }} (scripted)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        script: [app, flows]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      # The Linux fence's tools, as the unit shards set them up (agents in the journeys run fenced), and sqlite3 for the
      # journeys' own database reads.
      # Ubuntu's mirrors fail for minutes, once for hours (86% of failed CI jobs in Oct–Nov 2026 were this step). The
      # pinned packages first, then bounded retries inside the step's limit: the image's package lists, then up to three
      # refresh-and-install attempts, each under `timeout`. The tools are checked here, so a missing one fails setup, not a test. Kept inline (no
      # composite action): it runs as root, and a local action would come from the change's own checkout.
      - name: Linux tools, pinned packages first, then Ubuntu's mirrors with bounded retries
        timeout-minutes: 10
        run: |
          pkgs="bubblewrap socat ripgrep sqlite3"
          have() { for b in bwrap socat rg sqlite3; do command -v "$b" >/dev/null || return 1; done; }
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          # First the pinned packages from this repository's ci-tools release (GitHub's own hosts: they answer when
          # Ubuntu's mirrors don't), each file checked against its SHA-256 before anything installs it; Ubuntu's mirrors
          # only when they don't install (a newer image can outgrow them). The release notes say how the files were
          # fetched and checked; refresh them with a new release tag and new hashes here, never by replacing files.
          pinned="https://github.com/ap9000/toolroll/releases/download/ci-tools-noble-1"
          debs="$RUNNER_TEMP/ci-tools"; mkdir -p "$debs"
          if ! have; then
            if (cd "$debs" && timeout 60 curl -fsSL --retry 2 --retry-delay 3 --remote-name-all \
                  "$pinned/bubblewrap_0.9.0-1ubuntu0.3_amd64.deb" "$pinned/ripgrep_14.1.0-1_amd64.deb" "$pinned/socat_1.8.0.0-4ubuntu0.1_amd64.deb" &&
                printf '%s  %s\n' \
                  2461f1beee9cb04c8942739fe1a2b37e7b7c2a3d518f0779dc75f9245baa3094 bubblewrap_0.9.0-1ubuntu0.3_amd64.deb \
                  c5ae63c7bee915b1cfc9f0bd07c55b4ce7f2bcd1133cba4da56719aac26101a4 ripgrep_14.1.0-1_amd64.deb \
                  46e854289b6b1c97e28be5d9293bea61e8633d00d6a65d9513f019c7232696fe socat_1.8.0.0-4ubuntu0.1_amd64.deb |
                  sha256sum --strict -c -) && sudo dpkg -i "$debs"/*.deb; then
              :
            else
              echo "::warning::Linux tools: the pinned packages did not install, using Ubuntu's mirrors"
              sudo dpkg -r bubblewrap socat ripgrep >/dev/null 2>&1 || true
            fi
          fi
          have || timeout 60 $apt install -y --no-install-recommends $pkgs || true
          for attempt in 1 2 3; do
            have && break
            sudo dpkg --configure -a || true
            timeout 60 $apt update || echo "::warning::Linux tools: refreshing the package lists failed, trying the install anyway"
            timeout 60 $apt install -y --no-install-recommends $pkgs && break
            echo "::warning::Linux tools: attempt $attempt failed, retrying"; sleep 10
          done
          have || { echo "::error::Linux tools could not be installed: Ubuntu's package servers did not answer"; exit 1; }
          bwrap --version && socat -V | head -2 | tail -1 && rg --version | head -1
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run build
      # Playwright isn't a dependency (scripts/e2e-kit.mjs loadPlaywright finds npx's copy): pinned, with its Chromium.
      # The same bounded retries: `--with-deps` also goes to Ubuntu's mirrors.
      - name: Playwright's Chromium, with bounded retries
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            timeout 140 npx -y playwright@1.64.1 install --with-deps chromium && exit 0
            echo "::warning::Playwright install: attempt $attempt failed, retrying"; sleep 10
          done
          exit 1
      # Scripted failures are final (no retry hides one) and one failed group stops no other, as in the release check.
      # Every group with scripted journeys of its own runs here, the same groups the release check runs on a Mac: the
      # mail group's GreenMail runs in this runner's Docker, and onboarding drives util-linux's `script` (app-e2e.mjs
      # scriptCommand).
      - name: Scripted journeys, groups side by side
        shell: bash
        env:
          SCRIPT: ${{ matrix.script }}
          CI: "true"
          TOOLROLL_RELEASE_NO_RETRY: "1"
          TOOLROLL_CHECK_KEEP_GOING: "1"
          TOOLROLL_RELEASE_SCRIPTED_TIMEOUT_SECONDS: "90"
        run: node scripts/e2e-parallel.mjs "scripts/$SCRIPT-e2e.mjs" --skip-build --journeys scripted --at-once 3 --output "$RUNNER_TEMP/journeys"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: journeys-${{ matrix.script }}
          path: ${{ runner.temp }}/journeys
          retention-days: 7
