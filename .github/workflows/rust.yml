name: Rust

# The terminal workbench (tui/, docs/plans/solo-workbench.md T1): rustfmt, clippy with every warning an error, and the
# workspace's tests (the contract fixtures in test/fixtures/engine-api parsed by the Rust models, the client against a
# stand-in console, every screen state's snapshot) on Linux. Pull requests that touch the workbench, its contract, or
# this file. On macOS the same clippy and tests run inside tui-bundle.yml's macOS job, which every such pull request
# also starts: one macOS runner instead of two (docs/plans/ci-speed-2.md: macOS runners are what pull requests wait for).
#
# Advisory for now: not one of REQUIRED_PR_CHECKS, and the release verdict leaves these jobs out by name and workflow
# (release.ts ADVISORY_PR_CHECKS), until the workbench ships in the package. It reads no secret.

on:
  pull_request:
    paths:
      - "tui/**"
      - "test/fixtures/engine-api/**"
      - "src/contracts/engine-api.ts"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-')) && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust · ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Toolchain (tui/rust-toolchain.toml's exact Rust)
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' tui/rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          cd tui && cargo --version && rustc --version
      # Cargo's downloaded crates and the workspace's build, by OS, architecture, the exact toolchain and Cargo.lock
      # (docs/plans/ci-speed-2.md, item 5). This workflow runs on pull requests only, and GitHub scopes a pull request's
      # caches to that pull request: a later push to it starts warm, and nothing it saves reaches main, a release or
      # another pull request. Clippy and the tests still check every crate of the workspace; only unchanged compiled
      # dependencies are reused, and Cargo rebuilds whatever changed.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            tui/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tui/rust-toolchain.toml') }}-${{ hashFiles('tui/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tui/rust-toolchain.toml') }}-
      - name: Format
        working-directory: tui
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: tui
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        working-directory: tui
        run: cargo test --locked --workspace
