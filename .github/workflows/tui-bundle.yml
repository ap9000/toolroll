name: Workbench bundle

# The package a release publishes, proved on the pull request before any tag:
#
#   - "workbench bundle / binary · <platform>" and "workbench bundle / assemble": the SAME jobs publish.yml calls
#     (package-build.yml, the same runners and pinned actions and Rust): all four binaries built, signed (macOS) and
#     self-checked on their own platforms, then matched to their reports before anything runs, bundled, checked
#     (--verify) and packed, so a release is never their first run;
#   - "workbench bundle · <os>": a packed install opens the workbench it carries (scripts/tui-bundle-smoke.mjs): this
#     platform's binary built into dist/tui and checked (--bundle, --verify), the checkout packed and `npm i -g`'d into
#     a throwaway prefix with its own npm cache, bare `toolroll` from that install must open the bundled workbench in a
#     real pseudo-terminal (scripts/tui-e2e.mjs --expect bundled, no --tui-binary), and with the binary deleted from the
#     install, the classic Ink screen with the launcher's one-line notice. On Linux x64 and macOS arm64.
#
# Which runs: pull requests that touch the workbench, its launcher or contract, what gets packed, or this proof, and by
# hand. Advisory, like the install smoke: none is one of REQUIRED_PR_CHECKS, and the release verdict leaves them out by
# name and workflow (release.ts ADVISORY_PR_CHECKS). publish.yml's own run of the same jobs is what refuses a release.
# No secrets: it reads only, and needs the public npm registry for the package's dependencies.

on:
  pull_request:
    paths:
      - "tui/**"
      - "test/fixtures/engine-api/**"
      - "src/contracts/engine-api.ts"
      - "src/tui-launch.ts"
      - "src/trusted-path.ts"
      - "src/engine-handoff.ts"
      - "src/easy-start.ts"
      - "src/easy-start-args.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/tui-build.mjs"
      - "scripts/tui-e2e.mjs"
      - "scripts/tui-bundle-smoke.mjs"
      - "scripts/verify.mjs"
      - "scripts/verify-world.mjs"
      - "docs/feature-map.json"
      - "scripts/isolated-env.mjs"
      - "scripts/fixtures/pty-host.py"
      - ".github/workflows/publish.yml"
      - ".github/workflows/package-build.yml"
      - "tui/rust-toolchain.toml"
      - ".github/workflows/tui-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the run on its older head; never a release-* branch's run.
concurrency:
  group: tui-bundle-${{ (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-')) && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  # The package exactly as a release builds it, by the one definition publish.yml calls: the four binaries, then
  # assembled, checked and packed (package-build.yml), with no publishing right.
  binaries:
    name: workbench bundle
    permissions:
      contents: read
    uses: ./.github/workflows/package-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  bundle:
    name: workbench bundle · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            platform: darwin-arm64
            target: aarch64-apple-darwin
    env:
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Tested commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA" || { echo "checked out $(git rev-parse HEAD), expected $TESTED_SHA" >&2; exit 1; }
          echo "tested commit: $TESTED_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          check-latest: true
          cache: npm
      # Linux: the fence's tools Toolroll needs before it starts (bubblewrap, socat, ripgrep), and sqlite3 for the
      # journey's database read; bounded retries inside the step's limit, a missing tool fails here by name.
      - name: Linux tools
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          have() { for b in bwrap socat rg sqlite3; do command -v "$b" >/dev/null || return 1; done; }
          apt=(sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          for attempt in 1 2 3; do
            have && break
            timeout 120 "${apt[@]}" update && timeout 120 "${apt[@]}" install -y --no-install-recommends bubblewrap socat ripgrep sqlite3 && break
            echo "::warning::Linux tools: attempt $attempt failed, retrying"; sleep 10
          done
          have || { echo "::error::Linux tools could not be installed: Ubuntu's package servers did not answer"; exit 1; }
          bwrap --version && rg --version | head -1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run build
      - name: Toolchain (tui/rust-toolchain.toml's exact Rust)
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' tui/rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --target "$TARGET"
          cd tui && cargo --version && rustc --version
      - name: This platform's binary, into the package
        run: node scripts/tui-build.mjs --bundle dist/tui --targets "$PLATFORM"
      - name: Checked as npm publish would pack it
        run: node scripts/tui-build.mjs --verify --targets "$PLATFORM"
      - name: A packed install opens the bundled workbench; without it, the classic screen
        timeout-minutes: 15
        env:
          TMPDIR: ${{ runner.temp }}
        run: node scripts/tui-bundle-smoke.mjs --out "$RUNNER_TEMP/tui-bundle"
      # The runtime-verification command against this checkout's own bundled workbench: the unit shards have no Rust
      # binary (the launcher would open the classic screen), so its live run belongs here.
      - name: Runtime verification on the bundled workbench (scripts/verify.mjs)
        timeout-minutes: 15
        env:
          TMPDIR: ${{ runner.temp }}
        run: node scripts/verify.mjs --features welcome,new-task,help,agents,palette,settings,layout,zoom,search --out "$RUNNER_TEMP/verify"
