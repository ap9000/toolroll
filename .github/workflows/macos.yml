name: macOS

# The nightly macOS full suite. Pull requests and main pushes run it sharded
# (ci.yml), and release tags run the same matrix in publish.yml, where both
# legs must pass before npm publication.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  test:
    # Not "node N · macos-latest": that name is ci.yml's required check, and a required name from another workflow on
    # a candidate (this one dispatched by hand) fails the release's CI verdict rather than stand in for it.
    name: nightly macOS · node ${{ matrix.node }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      # src/provider.test.ts reads historical commits from Git, so this job
      # needs full history (see ci.yml).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:all
        env:
          CI: "true"
