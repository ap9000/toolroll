name: youiyoux

# Every pull request: what its UI changes add against Toolroll's design system, the kit (src/design/KIT.md,
# youi.config.json): a hand-built copy of a kit component, a hardcoded colour, spacing or radius a token holds,
# an import from another component library, or a broken kit rule on an added line. Each is a note on that line in
# Files changed, and any of them fails this job (--strict), so new drift never merges unnoticed. Existing debt is
# not counted (only what the pull request adds; youi.baseline.json records the rest). It is not one of
# REQUIRED_PR_CHECKS, so a release never waits for it. Pinned, so a youiyoux release never changes what it says.

on:
  pull_request:

permissions:
  contents: read

jobs:
  ui:
    name: youiyoux · UI drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx -y youiyoux@0.1.21 check --diff origin/${{ github.base_ref }} --strict --format github
