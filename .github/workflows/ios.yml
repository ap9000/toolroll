# The iPhone companion: Swift core tests (which read the shared Node/Swift fixtures in test/fixtures/companion-*) and
# an unsigned Simulator build of the app. Informational, not a required check.
name: iOS companion

on:
  pull_request:
    paths:
      - "ios/**"
      - "test/fixtures/companion-*"
      - "test/fixtures/companion-*/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (swift test)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: swift test
        working-directory: ios/Packages/ToolrollCompanionCore
        run: swift test

  app-build:
    name: App build (Simulator, unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build (Debug)
        run: |
          xcodebuild build \
            -project ios/ToolrollCompanion.xcodeproj \
            -scheme ToolrollCompanion \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build (Release, no test hooks)
        run: |
          xcodebuild build \
            -project ios/ToolrollCompanion.xcodeproj \
            -scheme ToolrollCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO
          app="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/ToolrollCompanion.app"
          test -f "$app/PrivacyInfo.xcprivacy"
          if strings "$app/ToolrollCompanion" | grep -E -- '--debug-state|--pair-payload|setNonceForTest'; then
            echo "DEBUG-only hooks found in the Release binary" >&2
            exit 1
          fi
